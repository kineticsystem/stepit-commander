# Parameters of the commander action server. The wildcard '/**' makes them
# independent of the name the node is launched with.
/**:
  ros__parameters:

    # Objectives are requested through this action.
    action_name: "commander/execute_objective"

    # How often the behavior tree is ticked, in Hz.
    tick_frequency: 100

    # How long a behavior waits for its action server or service, in ms.
    ros_plugins_timeout: 2000

    # A goal sent while an objective runs replaces it: the running tree is
    # halted at its next tick, its goal aborted, and the new objective starts.
    # With false, the new goal waits for the running objective to end.
    preempt: true

    # The behaviors and the trees are the robot's, not the server's: a robot
    # lists them in a parameter file of its own, passed to the launch file as
    # params_file, which is loaded after this one. For example:
    #
    #   plugins:          # folders, as "package_name/subfolder", of behaviors
    #     - my_behaviors/bt_plugins
    #   behavior_trees:   # folders of trees: objectives, and their subtrees
    #     - my_objectives/objectives
